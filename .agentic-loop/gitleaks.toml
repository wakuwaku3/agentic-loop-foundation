# Gitleaks configuration for this repository (Issue #61, ADR 0024).
#
# `useDefault = true` inherits gitleaks' own maintained detection rules (see
# docs/operations/secret-scanning.md for how to review upstream rule changes
# on a version bump). This repository does not define custom [[rules]]: the
# regex layer in .agentic-loop/guard-secrets.sh (SECRET_PATTERN/
# SENSITIVE_PATH) already covers this repository's known credential shapes
# and always runs alongside gitleaks, so duplicating it here would only add
# drift risk without adding coverage.
#
# [[allowlists]] entries below are the ONLY sanctioned way to suppress a
# false positive (a rule-level [rules.allowlist] under a future [[rules]]
# entry is equally sanctioned and audited the same way). Each entry MUST
# carry a `description` explaining why the match is not a real secret, and
# MUST NOT use a wildcard-equivalent pattern. `guard-secrets.sh --audit`
# enforces both, plus a cap of 8 total entries and the absence of a
# `.gitleaksignore` file (fingerprint-based ignores bypass this reviewed,
# bounded list and are never permitted in this repository). See
# docs/operations/secret-scanning.md for the allowlist review process.
title = "agentic-loop-foundation secret scan"

[extend]
useDefault = true
