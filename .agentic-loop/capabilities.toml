# Repository capability manifest for this Foundation itself (schema and
# operations: docs/operations/capability-manifest.md; design rationale:
# docs/decisions/0018-repository-capability-manifest.md).
#
# This is an index to the primary sources of truth, not a restatement of
# policy prose: it declares only the small set of facts that can be
# mechanically parsed and verified (paths, commands, booleans, lists).
# `bin/agentic-loop capabilities`, `doctor`, the worker prompts, and
# scripts/lint.sh all read it through the single shared parser/validator in
# bin/lib/agentic-loop/capability.sh.
#
# This file is distributed to brand-new installs verbatim (see
# scripts/lib/foundation-files.sh's INIT_FILES) because a freshly initialized
# repository receives this Foundation's own devbox.json/Makefile/CI wholesale,
# so these declarations are facts for it too. An existing repository being
# installed into instead gets a small detection-based generation step (see
# capability_generate in bin/lib/agentic-loop/capability.sh) that never
# fabricates values it cannot positively detect.
schema_version = 1
undetermined = []

[validation]
full_check = "devbox run --pure check"
fast_check = ".githooks/pre-commit"
secret_guard = ".agentic-loop/guard-secrets.sh"
secret_guard_modes = ["--staged", "--push", "--all", "--text", "--history", "--audit"]
# Measured on a change of this repository's own scale (see docs/operations/
# capability-manifest.md for how to re-measure after a substantial change);
# used as the basis for queue.worker_timeout_seconds, not enforced directly.
full_check_seconds = 750
# local affected check (Issue #59, ADR 0021): never a push/merge gate. Only
# shortens local iteration feedback; docs/operations/affected-checks.md.
affected_check = "devbox run --pure affected"
impact_map = "tests/impact-map.toml"
# Measured for a single-group selection (environment + lint + one E2E group)
# on this repository's own scale; see docs/operations/affected-checks.md.
affected_check_seconds = 735

[environment]
definition = ["devbox.json", "devbox.lock"]
platforms = ["x86_64-linux", "aarch64-linux"]
marker = "DEV_ENVIRONMENT=agentic-loop-foundation-v2"

[release]
deploy = false
binary_release = false
distribution = "main-merge"

[skills]
available = ["submit-requirement", "diagnose-codebase", "postmortem", "direct-edit"]

[[ownership]]
path = "bin"
purpose = "Issueキュー CLI とその実装モジュール"

[[ownership]]
path = "docs/policies"
purpose = "不変条件となるポリシー文書"

[[ownership]]
path = "docs/decisions"
purpose = "設計判断の記録(ADR)"

[[ownership]]
path = "scripts"
purpose = "install/upgrade/lint/formatなどの補助スクリプト"

[[ownership]]
path = "tests"
purpose = "E2Eテストハーネス"

[[ownership]]
path = ".agentic-loop"
purpose = "配布物であるguard/update-main/diagnose/capabilities宣言そのもの"

[[protected]]
path = ".agentic-loop/manifest.json"
reason = "install/upgradeが生成する機械記録。手編集しない"
change_requires = "tooling"

[[external_environment]]
name = "github"
desired_state = "docs/policies/external-environment.md"
apply = "bin/agentic-loop setup"
