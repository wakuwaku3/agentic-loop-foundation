name: v2 explicit GCP deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # A main push is only a trigger. No repository secret/variable means no
    # authentication and therefore no cloud mutation.
    if: vars.GCP_DEPLOY_ENABLED == 'true' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # v0.13.0
      - name: Cost and policy preflight
        run: |
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo 'WIF credential is not configured'; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo 'deploy service account is not configured'; exit 1; }
          devbox run --pure -- scripts/infra-policy.sh
      - name: Authenticate with explicit workload identity
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Plan
        env:
          TFVARS_FILE: ${{ vars.GCP_TFVARS_FILE }}
          TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
        run: devbox run --pure -- scripts/infra-plan.sh
      - name: Apply only the human-approved saved plan
        if: vars.GCP_APPLY_ENABLED == 'true'
        env:
          PREFLIGHT_RECORD: ${{ vars.GCP_PREFLIGHT_RECORD }}
        # The plan step above is the only place infra/build/infra.tfplan and
        # its infra/build/infra.plan.json digest are produced. Applying that
        # saved plan (rather than re-planning with tofu apply -var-file=...)
        # is what makes the object a human approved and the object that
        # executes provably the same artifact. This step fails closed if the
        # preflight record is missing, carries no approval, or its
        # target.plan_digest does not match the plan actually produced in
        # this run.
        run: |
          test -n "$PREFLIGHT_RECORD" || { echo "GCP_PREFLIGHT_RECORD is not configured"; exit 1; }
          test -f "$PREFLIGHT_RECORD" || { echo "preflight record $PREFLIGHT_RECORD is missing"; exit 1; }
          approval="$(devbox run --pure -- jq -r '.approval // empty' "$PREFLIGHT_RECORD")"
          test -n "$approval" || { echo "preflight record $PREFLIGHT_RECORD has no approval"; exit 1; }
          approved_digest="$(devbox run --pure -- jq -r '.target.plan_digest // empty' "$PREFLIGHT_RECORD")"
          test -n "$approved_digest" || { echo "preflight record $PREFLIGHT_RECORD has no target.plan_digest"; exit 1; }
          actual_digest="$(devbox run --pure -- sha256sum infra/build/infra.plan.json | cut -d' ' -f1)"
          if [ "$approved_digest" != "$actual_digest" ]; then
            echo "plan digest mismatch: approved=$approved_digest actual=$actual_digest"
            exit 1
          fi
          cd infra && devbox run --pure -- tofu apply -input=false build/infra.tfplan
