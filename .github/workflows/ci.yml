name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - queue
          - lifecycle
          - auxiliary
          - upgrade
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0
        with:
          devbox-version: 0.17.2
          sha256-checksum: 111bc3436fe1a1a60cdc67a532d6d5dae0402f092ef6f95055c139711374a800
          # The repository uses GitHub's default 10 GB limit; older entries are evicted at the limit.
          enable-cache: 'true'
      - run: devbox run --pure -- env AGENTIC_LOOP_TEST_GROUP=${{ matrix.group }} make check
