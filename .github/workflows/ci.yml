name: v2 selective CI
on:
  push:
    branches: [v2]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # v0.13.0
      - name: Verify parent CI attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: scripts/verify-parent-ci.sh
      - run: devbox run --pure -- make affected
      - run: devbox run --pure -- make candidate-affected
