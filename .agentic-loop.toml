# Agentic Loop configuration. Copy overrides into .agentic-loop.local.toml
# (git-ignored) to change values per environment; local keys win over these.

[agent]
# Default AI provider (codex | claude | opencode) for phases that set none.
provider = "codex"

# Each Issue runs a flagship plan phase, then a cheaper exec phase. Set provider
# and model per phase to mix tools, e.g. plan with Codex and exec with opencode.
# model is empty by default (the CLI default); opencode models use "provider/model".
# reasoning_effort is passed to Codex (-c model_reasoning_effort) and to Claude
# (--effort, levels low|medium|high|xhigh|max). Declaring nothing leaves the
# provider CLI default in place, except for Codex which keeps its historical
# fallback (plan=high / exec=low). opencode exposes no equivalent flag.
#
# To declare ordered pool/model fallback (Issue #155), replace a phase's scalar
# keys with `[[agent.<phase>.tiers]]`: each tier binds one subscription `pool`
# (quota boundary) to one `provider` and an ordered `models` list. A pool that
# is exhausted (usage quota / 429) is skipped until it recovers; within a pool,
# a model whose measured usage exceeds `max_usage_percent` demotes to the next
# model (unset = use until the pool is exhausted). The whole phase runs the
# first tier/model whose pool is usable. Example (local override recommended):
#
#   [agent.plan]
#   [[agent.plan.tiers]]
#   pool = "plus"
#   provider = "codex"
#   reasoning_effort = "high"
#   models = [{ model = "gpt-5.6-sol", max_usage_percent = 60 }]
#
#   [[agent.plan.tiers]]
#   pool = "gogo"
#   provider = "opencode"
#   reasoning_effort = "high"
#   models = [
#     { model = "opencode-go/gpt-5.6-luna", max_usage_percent = 60 },
#     { model = "opencode-go/kimi-k2.7-code", max_usage_percent = 85 },
#     { model = "opencode-go/deepseek-v4-pro" },  # 閾値省略 = 最後まで使う
#   ]
#
# The scalar keys below remain equivalent to a single implicit tier (pool =
# provider name) for backward compatibility.
[agent.plan]
# provider = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[agent.exec]
# provider = "opencode"
model = "gpt-5.6-terra"
reasoning_effort = "low"

[agent.retry]
# Re-plan with the flagship plan phase this many times when exec cannot complete.
plan_max = 1

# Weekly codebase self-diagnosis. Inherits [agent].provider when unset. Only
# Codex enforces read-only via its sandbox; other providers rely on the prompt.
[agent.diagnose]
# provider = "codex"
model = "gpt-5.6-terra"
reasoning_effort = "low"

[budget]
# Optional ceiling on how much ONE stage execution (a single plan or exec
# provider call) may spend, in USD. Claude receives it as --max-budget-usd;
# reaching it ends that stage as an ordinary retryable failure (the pool is not
# marked exhausted) and the Issue follows the usual bounded retry path. Unset
# (commented out) means no ceiling.
# max_stage_cost_usd = 5
# Leave an emergency reserve: pause claiming new Issues while the weekly usage
# exceeds (100 - this percent). Only Codex exposes usage without a session, so
# the guard is best-effort for other providers. Zero disables it.
weekly_reserve_percent = 20

[queue]
# Polling and concurrency defaults. Use non-negative integer seconds/counts.
poll_seconds = 30
# While the queue is idle the poll interval backs off exponentially from
# poll_seconds up to this, to cut GitHub API reads. Set equal to poll_seconds
# to disable idle backoff.
poll_max_seconds = 120
max_workers = 4
lease_seconds = 300
# Zero waits indefinitely for workers during a graceful stop.
stop_timeout = 0
# `pause`/`abort` drain the owning host's worker cooperatively (a stop-request
# file the worker checks at its own stage boundaries) for up to this many
# seconds before escalating to TERM, then 5s later to KILL, so an unsafe-to-
# interrupt section (see `queue.worker_timeout_seconds`'s process-group kill,
# which this mirrors) gets a bounded chance to finish on its own first.
pause_grace_seconds = 120
# Zero disables automatic stale closure. Otherwise queued Issues inactive for
# this many days are marked agent:stale and closed before work is claimed.
stale_days = 30
# Keep enough GraphQL capacity for Issue state transitions and worker recovery.
# Best-effort Projects synchronization pauses below this remaining budget.
graphql_reserve = 500
# Keep a REST(core) reserve for lease heartbeats, restart recovery and in-flight
# worker writes: claiming new Issues pauses while remaining core quota is at or
# below this. Zero disables the guard.
core_reserve = 500
# Processes share the latest rate-limit observation through Git common state.
rate_limit_cache_seconds = 15
# Retry only classified transient REST failures; permanent 4xx errors fail fast.
api_retry_attempts = 3
api_retry_base_seconds = 1
# A worker failure is treated as transient and retried up to this many total
# attempts (with a cooldown) before the Issue stays agent:failed for review.
max_attempts = 3
retry_cooldown_seconds = 600
# Lease heartbeat proves the worker process is alive, not that work is
# progressing. Terminate a worker (process group) that has run longer than
# this and fail its Issue so the bounded retry above resumes it. Zero
# disables it. Tune from each Issue's agentic-loop:usage comment (所要=Ns).
worker_timeout_seconds = 14400
# worker-orphan safety net (Issue #193): a live local worker (this host's
# pidfile) whose Issue GitHub no longer reports as agent:running (fell back to
# queued/failed while the local provider CLI process kept running) is stopped
# process-group-wide and its local state cleared without waiting for
# worker_timeout_seconds. A single poll observing the mismatch never kills --
# only after it persists for this many seconds (grace against the brief
# window between a normal completion's Label update and process exit) is the
# worker actually reaped. Zero disables it.
worker_orphan_grace_seconds = 120
# Stall observability thresholds (see docs/decisions/0031, observation only --
# automatic termination is worker_timeout_seconds above). Non-provider stages
# (claim/worktree/checks/merge/...) compare their last progress marker against
# stall_seconds. The provider stages (plan/exec/replan) block on one long CLI
# call and use the wider provider_stall_seconds instead, so normal reasoning
# time is never misreported as a stall. Tune both from each Issue's
# agentic-loop:usage comment (所要=Ns); zero disables stall detection for that
# band. `bin/agentic-loop _timing-check --committed` (a hard gate in
# scripts/lint.sh) and `doctor` cross-check these two values against the
# other time constants above and against events.log's real observed stage
# durations -- see docs/decisions/0032.
stall_seconds = 300
provider_stall_seconds = 3600
# Change-scope conflict avoidance: an Issue may declare the paths/environments
# it touches with an `agentic-loop:scope` marker (see docs/operations/issue-queue.md).
# Only hard conflicts serialize: structural changes (rename/move, declared with
# `structural=1` or measured from the worker's diff), `paths=*`, exact env names,
# and undeclared scopes under unknown_scope=isolated. A plain overlap of the
# same path without a structural change runs in parallel and converges through
# rebase/re-validation at merge time. unknown_scope controls Issues that declare
# no scope: isolated (default) lets at most one undeclared-scope Issue run at a
# time; exclusive treats them as touching the whole repository; open skips
# conflict avoidance for them entirely.
unknown_scope = "isolated"
# Comma-separated path prefixes always treated as touching the whole
# repository (shared infrastructure, lockfiles, generated artifacts). Empty by
# default so enabling this feature does not serialize existing Issues.
exclusive_paths = ""
# Requirement traceability gate (see docs/decisions/0017-requirement-traceability.md,
# docs/operations/traceability.md): a merged PR may carry a fenced
# `agentic-loop:traceability` JSON record mapping each acceptance criterion to
# the changes/checks that satisfied it. "require" blocks completion (without
# closing the Issue or deleting its worktree/branch) when the record is
# missing or does not reconcile with GitHub's observed checks/changed files;
# "warn" evaluates the same record but only posts an advisory comment; "off"
# disables evaluation entirely. This repository ships "warn" so its own queue
# starts recording evidence immediately without blocking completion; switch to
# "require" once the PR-body convention is consistently followed.
traceability = "warn"
# Change-risk preflight gate (see docs/decisions/0020-change-risk-preflight.md,
# docs/operations/preflight.md): the plan stage may self-declare risk on 10
# fixed axes; this is cross-checked against a signal derived only from
# .agentic-loop/capabilities.toml and the Issue's cached change scope (zero
# extra API calls). "require" gates every non-autonomous verdict (including a
# missing/invalid record) into agent:needs-input before exec runs; "warn"
# gates only genuinely risky verdicts (approval-required/undetermined/
# signal-mismatch) and otherwise posts an audit/advisory comment and
# continues; "off" disables evaluation entirely. This repository ships "warn"
# so its own queue does not self-lock on introduction; switch to "require"
# once the plan-stage record convention is consistently followed.
preflight = "warn"
# Finite-resource/scalability workload budget gate (see
# docs/decisions/0025-resource-scalability-budget.md, docs/operations/
# workload-budget.md): the plan stage may self-declare a processing-volume
# model (call counts per unit, growth rate against input size, stop
# conditions, reuse) whenever it adds or changes external I/O. "require"
# gates a missing/invalid record into agent:needs-input before exec runs;
# "warn" posts an audit/advisory comment and continues either way; "off"
# disables evaluation entirely. This repository ships "warn" so its own queue
# does not self-lock on introduction; switch to "require" once the plan-stage
# record convention is consistently followed.
workload = "warn"

[postmortem]
# Closed-loop postmortem learning (see docs/policies/postmortem.md,
# docs/decisions/0026-postmortem-closed-loop.md). "on" lets the two
# structurally cheap detection points (park_issue's repeated-failure, and
# exhaustion_note_pause's all-pools-exhausted transition) create a dedup-
# checked `postmortem`-labeled Issue; "off" disables automatic creation
# entirely (explicit `bin/agentic-loop postmortem create` still works).
auto_detect = "on"
# Bound on total auto-created postmortem Issues per UTC day (1-20), so a
# flapping failure/exhaustion condition cannot create unbounded Issues.
max_auto_created_per_day = 5

[foundation]
# Foundationの配布元repository。`agentic-loop upgrade` はここを基準に新しいrevisionを取得する。
repository = "wakuwaku3/agentic-loop-foundation"
# 適用済み・pin対象のrevision(40桁SHA)。空のままだとupgradeは未検証のrevisionへ
# 暗黙追従せず、明示的な --revision または --source を要求する。最初のupgrade適用
# 成功時にここへ実際に適用したrevisionが自動で書き込まれる。
revision = ""
# upgrade適用後に実行する完全検証コマンド。失敗時は自動rollbackせず、
# `agentic-loop upgrade --rollback` の案内を提示したまま適用状態を保持する。
verify_command = "devbox run --pure check"
