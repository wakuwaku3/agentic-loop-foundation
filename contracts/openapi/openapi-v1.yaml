      properties: {state: {type: string, enum: [executable, blocked, unobserved, retired]}, executable: {type: boolean}, reason: {type: string}, observed_at: {type: string, format: date-time}, stale: {type: boolean}}
    RepositoryObservation:
      type: object
      additionalProperties: false
      required: [repository_id, locator, reachable, can_push, observed_at]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, reachable: {type: boolean}, default_branch: {type: string}, can_push: {type: boolean}, forge_node_id: {type: string}, adapter_version: {type: string}, reason: {type: string}, observed_at: {type: string, format: date-time}}
    RepositoryResponse:
      type: object
      additionalProperties: false
      required: [repository_id, locator, status, version, requested_by]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, status: {type: string, enum: [registered, retired]}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}}
    RepositoryView:
      type: object
      additionalProperties: false
      required: [repository_id, locator, status, version, requested_by, executability]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, status: {type: string, enum: [registered, retired]}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, executability: {$ref: '#/components/schemas/RepositoryExecutability'}}
    RepositoryListResponse:
      type: object
      additionalProperties: false
      required: [repositories]
      properties: {repositories: {type: array, items: {$ref: '#/components/schemas/RepositoryView'}}}
    ObservedState:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties: {state: {type: string, enum: [measured, unobserved, not-implemented]}, reason: {type: string, description: why this declared observable has no measured value at this revision}}
    RepositoryBacklogView:
      type: object
      additionalProperties: false
      required: [state, reason, requirement_count]
      properties: {state: {type: string, enum: [measured, unobserved, not-implemented]}, reason: {type: string}, requirement_count: {type: integer, minimum: 0, description: 'Requirements linked to this Repository through the write-once Requirement-to-Repository association, read in this request and bounded in the storage query'}, truncated: {type: boolean, description: 'the bounded read hit its limit, so requirement_count is a lower bound and not an exact total'}, installation_scope: {$ref: '#/components/schemas/QueueSummary'}}
    RepositoryDetailResponse:
      type: object
      additionalProperties: false
      required: [repository_id, locator, status, version, requested_by, application_release, policy, requirement_backlog, runners_and_ai_resources, executability, effective_control_mode, effective_control_revision]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, status: {type: string, enum: [registered, retired]}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, application_release: {$ref: '#/components/schemas/ObservedState'}, policy: {$ref: '#/components/schemas/ObservedState'}, requirement_backlog: {$ref: '#/components/schemas/RepositoryBacklogView'}, runners_and_ai_resources: {$ref: '#/components/schemas/ObservedState'}, executability: {$ref: '#/components/schemas/RepositoryExecutability'}, observation: {$ref: '#/components/schemas/RepositoryObservation'}, effective_control_mode: {type: string}, effective_control_revision: {type: integer}}
    ObserveRepositoryResponse:
      type: object
      additionalProperties: false
      required: [repository_id, accepted, observed_at, executability]
      properties: {repository_id: {type: string}, accepted: {type: boolean}, observed_at: {type: string, format: date-time}, executability: {$ref: '#/components/schemas/RepositoryExecutability'}}
    RenewRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_lease_version, fencing_token, control_revision]
      properties: {request_id: {type: string}, expected_lease_version: {type: integer}, fencing_token: {type: integer}, control_revision: {type: integer}}
    StartRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_execution_version, control_revision]
      description: |
        provider is additive and optional (V2-067). It names the Provider this
        Execution is about to be driven through, and start is the carrier
        because the Runner is the only party that knows which Provider it is
        about to invoke. The assignment it records is a side table keyed by
        Execution id, written inside start's existing transaction, so it
        appears and disappears with the Execution it describes. Absent records
        no assignment and changes no Provider's active_assignments; a value
        outside the closed set of three is refused with 400 and records
        nothing.
      properties: {request_id: {type: string}, expected_execution_version: {type: integer}, control_revision: {type: integer}, provider: {type: string, enum: [codex, claude, opencode]}}
