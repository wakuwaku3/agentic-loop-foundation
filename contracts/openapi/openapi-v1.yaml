    SourceLocator:
      type: object
      additionalProperties: false
      required: [forge, host, owner, name]
      properties: {forge: {const: github}, host: {type: string}, owner: {type: string}, name: {type: string}, default_branch: {type: string}}
    RepositoryExecutability:
