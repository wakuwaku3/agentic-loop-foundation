openapi: 3.1.0
info:
  title: Agentic Loop Control Plane API
  version: 1.0.0
  description: |
    Public transport contract. Human callers capture requirements and issue
    control intents. Increment decomposition/planning is intentionally not a
    public owner operation; it remains a loop scheduler responsibility.
paths:
  /internal/reconcile:
    post:
      operationId: triggerInternalReconcile
      security: [{reconcileScheduler: []}]
      responses: {'202': {description: reconciliation accepted}, '401': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /healthz:
    get:
      operationId: healthz
      responses:
        '200': {description: healthy, content: {application/json: {schema: {$ref: '#/components/schemas/HealthResponse'}}}}
  /v1/requirements:
    get:
      operationId: listRequirements
      security: [{iapOwner: []}]
      parameters: [{name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}, {name: cursor, in: query, schema: {type: string, description: opaque cursor from the previous page}}, {name: repository_id, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 512}, description: 'filter the Backlog to the Requirements linked to one Repository. It composes with page_size and cursor. An UNKNOWN repository id returns an EMPTY list, never the unfiltered page. A blank or over-long value is refused with 400 invalid_request. The filter resolves through the write-once Requirement-to-Repository link and the bound that read applies is surfaced in the response filter object rather than hidden.'}]
      responses: {'200': {description: bounded requirement page, content: {application/json: {schema: {$ref: '#/components/schemas/RequirementPageResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
    post:
      operationId: captureRequirement
      security: [{iapOwner: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureRequest'}}}}
      responses: {'201': {description: captured, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/enrollment:
    post:
      operationId: issueRunnerEnrollment
      security: [{iapOwner: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerEnrollmentRequest'}}}}
      responses: {'201': {description: one-time enrollment token}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/runner/enrollment/challenge:
    post:
      operationId: beginRunnerEnrollment
      security: [{iapOwner: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerChallengeRequest'}}}}
      responses: {'200': {description: Ed25519 challenge}, '401': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/enrollment/complete:
    post:
      operationId: completeRunnerEnrollment
      security: [{iapOwner: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerCompleteRequest'}}}}
      responses: {'200': {description: short-lived runner session}, '401': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:
    get:
      operationId: getRequirement
      security: [{iapOwner: []}]
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: requirement detail, content: {application/json: {schema: {$ref: '#/components/schemas/RequirementDetailResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /v1/controls:
    get:
      operationId: listControlReads
      security: [{iapOwner: []}]
      responses: {'200': {description: control lifecycle metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ControlReadListResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
    post:
      operationId: setControl
      security: [{iapOwner: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ControlRequest'}}}}
      responses: {'200': {description: changed, content: {application/json: {schema: {$ref: '#/components/schemas/ControlResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/queue/summary:
    get:
      operationId: queueSummary
      security: [{iapOwner: []}]
      responses: {'200': {description: bounded queue counts with the scheduler's own allocation, waiting reasons and exhaustion state, content: {application/json: {schema: {$ref: '#/components/schemas/QueueSummaryResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/runners:
    get:
      operationId: listRunners
      security: [{iapOwner: []}]
      description: |
        Read-only. Reports, per Runner the Control Plane has heard from,
        whether that Runner has reported the version it is running at all,
        whether the newest report is older than the declared staleness
        window, the reported binary coordinates and canonical schema interval
        when and only when a report exists, and the intersection of every
        enumerated Runner's interval. The intersection is unknown -- never
        non-empty -- whenever any enumerated Runner has not reported, whenever
        no Runner is known, and whenever the bounded enumeration truncated.
        A Runner's report is never authority over what that Runner may read,
        and nothing here advances or gates a canonical schema: no canonical
        schema counter exists in this repository, so the interval is reported
        and compared against nothing. There is deliberately no POST: a Runner
        reports through runner_version on POST /v1/runner/heartbeat.
      responses: {'200': {description: what each Runner reports about the version it is running, content: {application/json: {schema: {$ref: '#/components/schemas/RunnerListResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/providers:
    get:
      operationId: listProviders
      security: [{iapOwner: []}]
      description: |
        Read-only. Reports, for each of the three declared Providers (codex,
        claude, opencode), whether the owner's in-repository standing
        authorization covers it, whether the Loop has ever completed an
        invocation through it, a closed health value with the instant of the
        newest observation and an explicit stale flag, the runner-local
        runaway detector's state by state alone with the approved record the
        thresholds live in named rather than copied, the control plane's own
        concurrency allocation with the source of the ceiling named, and the
        Executions currently assigned to it.
        Every value is derived from observations the Loop's own execution path
        produced. No CLI is started, no socket is opened and no timer polls
        anything: an active probe would itself be an invocation counted by the
        runaway detector this surface reports, so the registry could trip the
        halt it is meant to describe. A go/ast import scan over
        internal/application proves there is no probe path.
        authorized and verified_by_loop_invocation are two separately-sourced
        facts and never one connected flag: today they disagree for two of the
        three Providers, and a single boolean would have to pick one and be
        wrong about the other. A Provider with no observation is unknown and
        stale, never healthy.
        There is deliberately no cursor and no page_size: the collection is a
        three-element closed set and cannot grow. There is deliberately no
        POST, PUT or DELETE: an observation rides on
        provider_observation of POST /v1/executions/result, an assignment
        rides on provider of POST /v1/executions/{execution_id}:start, and a
        stop for inspection is cleared only by the owner issuing a new
        approved record.
      responses: {'200': {description: the Provider registry, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderRegistryResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/export:
    get:
      operationId: exportOwnerMetadata
      security: [{iapOwner: []}]
      parameters: [{name: format, in: query, schema: {type: string, enum: [json, ndjson], default: json}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}]
      responses: {'200': {description: metadata-only export; provider output and secrets are excluded, content: {application/json: {schema: {$ref: '#/components/schemas/ExportResponse'}}, application/x-ndjson: {schema: {$ref: '#/components/schemas/ExportRecord'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}
  /v1/release/state:
    get:
      operationId: getReleaseState
      security: [{iapOwner: []}]
      description: |
        Read-only. Returns the Preview release identity this process was
        assembled from, the eight promotion conditions of
        release-contract.md section 4 each as met / unmet /
        not-observable-here with a reason and the named source that decided
        it, an aggregate promotable flag that is true only when all eight are
        met, the rollback target with the recorded rollback history and a
        bounded retention read, and an explicit list of what this environment
        class cannot observe. No route promotes, rolls back or changes a
        route. 503 is returned when the process was not given an explicit
        release source root, in which case no version is reported at all.
      responses: {'200': {description: the release surface of this process, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseStateResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/work:
    get:
      operationId: offeredWork
      security: [{runnerSession: []}]
      description: |
        Read-only, runner-role only, and the only runner-readable route.
        It exists because of a measurement: POST /v1/runner/claims:acquire
        requires a caller-supplied increment_id and expected_increment_version,
        every other runner route is a POST, and GET /v1/queue/summary and
        GET /v1/export are owner-only -- so before this route a
        separate-process Runner could not discover claimable work by any means.
        It returns at most a declared cap of triples naming Increments in the
        ready status whose parent Requirement is in a state that admits work,
        derived from the same bounded page the Loop's own pass reads. It
        carries no work packet, no requirement text, no digest and no
        credential-shaped field, and it mutates nothing: an offer is not a
        reservation, and the claim that follows is still judged on its own.
        There is deliberately no POST.
      responses: {'200': {description: the bounded set of Increments this Runner may claim, content: {application/json: {schema: {$ref: '#/components/schemas/OfferedWorkResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/claims:acquire:
    post:
      operationId: claim
      security: [{runnerSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimRequest'}}}}
      responses: {'200': {description: claimed, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/permits:check:
    post:
      operationId: permit
      security: [{runnerSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PermitRequest'}}}}
      responses: {'200': {description: decided, content: {application/json: {schema: {$ref: '#/components/schemas/PermitResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/executions/result:
    post:
      operationId: acceptResult
      security: [{runnerSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResultRequest'}}}}
      responses: {'200': {description: accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ResultResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/heartbeat:
    post:
      operationId: heartbeat
      security: [{runnerSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/HeartbeatRequest'}}}}
      responses: {'200': {description: accepted, content: {application/json: {schema: {$ref: '#/components/schemas/LifecycleResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/runner/checkpoints:
    post:
      operationId: checkpoint
      security: [{runnerSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointRequest'}}}}
      responses: {'200': {description: accepted, content: {application/json: {schema: {$ref: '#/components/schemas/LifecycleResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/leases/{lease_id}:renew:
    post:
      operationId: renewLease
      security: [{runnerSession: []}]
      parameters: [{name: lease_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RenewRequest'}}}}
      responses: {'200': {description: renewed, content: {application/json: {schema: {$ref: '#/components/schemas/RenewResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/executions/{execution_id}:start:
    post:
      operationId: startExecution
      security: [{runnerSession: []}]
      parameters: [{name: execution_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartRequest'}}}}
      responses: {'200': {description: started, content: {application/json: {schema: {$ref: '#/components/schemas/StartResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:request-input:
    post:
      operationId: requestHumanInput
      security: [{runnerSession: []}]
      description: |
        The Loop asks the owner a question it may not answer itself, and the
        Requirement moves to needs-input in the same transaction. Callable by
        a Runner or by the scheduler; the owner is refused, because the owner
        answers questions rather than asking them. No domain Permit is
        evaluated and no outbox item is staged: asking only removes
        capability, so gating it behind a side-effect permit would leave the
        system unable to record why it stopped at exactly the moment a stop
        is in force. While the Requirement waits, no new claim is issued and
        no held claim is extended for its Increments.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RequestHumanInputRequest'}}}}
      responses: {'200': {description: the question was recorded and the Requirement is in needs-input, content: {application/json: {schema: {$ref: '#/components/schemas/RequestHumanInputResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:answer-input:
    post:
      operationId: answerHumanInput
      security: [{iapOwner: []}]
      description: |
        The owner answers a recorded question by naming one of its options,
        and the SAME Requirement resumes: no Requirement is created. Owner
        role only. The chosen option must be one of the recorded options --
        there is no default option, no expiry-driven selection and no timeout
        that answers anything -- and the expected Requirement version must
        match. A second answer to an already-answered question is refused by
        the domain transition table itself, not by an application flag. The
        intake Permit is evaluated against the installation target, exactly
        as capture is, so a pause-intake or any stop mode denies resuming.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnswerHumanInputRequest'}}}}
      responses: {'200': {description: the answer was recorded and the same Requirement resumed, content: {application/json: {schema: {$ref: '#/components/schemas/AnswerHumanInputResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:start-framing:
    post:
      operationId: startRequirementFraming
      security: [{iapOwner: []}]
      description: |
        The owner asks that a captured Requirement start being shaped, and it
        moves from captured to framing. This is the one edge that leaves the
        captured status: before it existed, the only Requirement status any
        caller could reach was captured, so the needs-input question below
        could never be asked, because that transition is admitted from
        framing, active and evaluating only.

        Callable by the owner or by the scheduler; a Runner is refused,
        because a Runner executes an Increment it was handed and does not
        decide that a Requirement should start being shaped. Admitted from
        captured only: a Requirement already in framing is refused by the
        domain transition table itself, not by an application flag.

        The claim Permit is evaluated against the Requirement's own target,
        so pause-claim and every stop mode deny it, while pause-intake still
        ALLOWS it: pause-intake means take no new work in and finish what you
        already have, and framing an already-captured Requirement is
        finishing what you have. No outbox item is staged: nothing outside
        the control plane is asked to do anything by a Requirement beginning
        to be shaped.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartRequirementFramingRequest'}}}}
      responses: {'200': {description: the Requirement left captured and is in framing, content: {application/json: {schema: {$ref: '#/components/schemas/StartRequirementFramingResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:complete-framing:
    post:
      operationId: completeRequirementFraming
      security: [{iapOwner: []}]
      description: |
        The owner declares that an already-framed Requirement's analysis is
        finished and that it is executable, and it moves from framing to ready.
        This is the edge that reaches the only status the scheduler calls
        schedulable: before it existed, ready was reachable ONLY by asking the
        Requirement a question and answering it, because the ready transition's
        sole issuer was the answer command. A Requirement that needed no
        question could not become executable at all.

        Callable by the owner or by the scheduler; a Runner is refused, because
        a Runner executes an Increment it was handed and does not decide that a
        Requirement is executable. Admitted from framing only: a Requirement
        still in captured, or already in ready, is refused by the domain
        transition table itself, not by an application flag.

        The claim Permit is evaluated against the Requirement's own target, so
        pause-claim and every stop mode deny it, while pause-intake still
        ALLOWS it: pause-intake means take no new work in and finish what you
        already have, and finishing the framing of something already captured
        is finishing what you have. pause-claim denying it is the boundary the
        kind was chosen for, because declaring a framed Requirement executable
        is the moment it becomes claimable. No outbox item is staged: nothing
        outside the control plane is asked to do anything by a Requirement
        becoming executable.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteRequirementFramingRequest'}}}}
      responses: {'200': {description: the Requirement left framing and is in ready, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteRequirementFramingResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:pause:
    post:
      operationId: pauseRequirement
      security: [{iapOwner: []}]
      description: |
        The owner stops further processing of a Requirement, and it moves to
        paused while remembering which of ready, active, waiting or recovering
        it came from. Callable by the OWNER ONLY: a Runner and the scheduler are
        both refused with 403, because stopping a Requirement is the user's
        decision and not the Loop's.

        WHAT A PAUSE DOES NOT DO, stated plainly because a pause that claimed
        more than it does would be worse than none. It changes the
        Requirement's own status and nothing else. It does NOT terminate a
        running Execution, does NOT release or expire a Lease, does NOT
        propagate anything to a Runner, and does NOT verify stop completion --
        acknowledging a stop command is not completing it, and completion
        requires observing the worker's ack, the process exit and the lease
        release or expiry. The propagation half of a pause is a Control Intent,
        which POST /v1/controls already provides, and the two halves are
        deliberately NOT fused into one request: they have separate lifecycles
        and separate idempotency stories.

        This route evaluates NO control permit, so it is ALLOWED under all
        seven control modes including emergency-stop. That is deliberate: a
        stop the owner cannot issue while a stop is already in force would
        invert what a control is for.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PauseRequirementRequest'}}}}
      responses: {'200': {description: the Requirement is paused and remembers the status a resume will restore, content: {application/json: {schema: {$ref: '#/components/schemas/PauseRequirementResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:resume:
    post:
      operationId: resumeRequirement
      security: [{iapOwner: []}]
      description: |
        The owner lifts a pause, and the Requirement returns to the EXACT
        status it was in when it was paused -- not to a status chosen by a
        rule. Admitted from paused only, and refused with 400 when the paused
        Requirement carries no remembered origin, which is the shape a record
        stored before the memory field existed has. Callable by the OWNER ONLY:
        a pause the Loop could lift on its own would not be a pause.

        This is the ONE of the three verbs that evaluates a control permit, of
        the claim kind, so it is ALLOWED under allow and pause-intake and
        DENIED under pause-claim, graceful-stop, immediate-stop, emergency-stop
        and cancel -- two of seven. Resuming is the moment the Requirement
        becomes claimable again, which is exactly what pause-claim exists to
        withhold. The asymmetry with :pause and :cancel is the design: a resume
        can only increase what the Loop may do, while a pause and a cancel can
        only reduce it, so under emergency-stop a paused Requirement's resume is
        denied and its cancel is allowed and the paused state is never a dead
        end.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeRequirementRequest'}}}}
      responses: {'200': {description: the Requirement returned to the exact status it was paused from, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeRequirementResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/requirements/{requirement_id}:cancel:
    post:
      operationId: cancelRequirement
      security: [{iapOwner: []}]
      description: |
        The owner records that this Requirement will not be solved, and it
        moves to the terminal cancelled status. Any pause memory is cleared,
        because a cancelled Requirement is terminal and a remembered origin on
        it would advertise a resumption the lifecycle does not honour.
        Admitted from every status except completed and cancelled. Callable by
        the OWNER ONLY.

        Like :pause this route evaluates NO control permit and is therefore
        ALLOWED under all seven control modes. That is the property that makes
        the pause safe to offer at all: a paused Requirement retains at least
        one exit under every mode.
      parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancelRequirementRequest'}}}}
      responses: {'200': {description: the Requirement is cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/CancelRequirementResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/repositories:
    get:
      operationId: listRepositories
      security: [{iapOwner: []}]
      responses: {'200': {description: registered repositories with their measured or explicitly unobserved executability, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryListResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
    post:
      operationId: registerRepository
      security: [{iapOwner: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRepositoryRequest'}}}}
      responses: {'201': {description: registered, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/repositories/{repository_id}:
    get:
      operationId: getRepository
      security: [{iapOwner: []}]
      parameters: [{name: repository_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: repository detail; every declared observable is either measured or carries an explicit unobserved state with its reason, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryDetailResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/repositories/{repository_id}:retire:
    post:
      operationId: retireRepository
      security: [{iapOwner: []}]
      parameters: [{name: repository_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetireRepositoryRequest'}}}}
      responses: {'200': {description: retired; the registration is rolled back as a transition and the aggregate is never deleted, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /v1/repositories/{repository_id}:observe:
    post:
      operationId: observeRepository
      security: [{runnerSession: []}]
      parameters: [{name: repository_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObserveRepositoryRequest'}}}}
      responses: {'200': {description: bounded forge reachability observation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ObserveRepositoryResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '415': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /owner/docs/:
    get:
      operationId: listOwnerDocuments
      security: [{iapOwner: []}]
      description: |
        The owner-readable index of the user documents that correspond to the
        channel and version this process is actually running. The set listed is
        EXACTLY the documentation-role member set of the release bundle the
        process assembled from its explicitly configured source root; it is
        recomputed from the tree rather than written down, and a path outside it
        is refused before any file is opened. With NO release source configured
        this route answers the SAME 503 release_observer_not_configured that
        GET /v1/release/state answers, and never a defaulted root: a defaulted
        root would make the process report a version it was not assembled from.
      responses: {'200': {description: the resolved channel, the assembled release version and the documents available, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerDocumentIndexResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /owner/{document_path}:
    get:
      operationId: getOwnerDocument
      security: [{iapOwner: []}]
      parameters: [{name: document_path, in: path, required: true, schema: {type: string}, description: 'the repository-relative member path the index lists, verbatim, for example docs/preview/index.md; it is used for one thing only, a lookup in the assembled member set, and is never joined onto a root'}]
      description: |
        One user document, served only when document_path is literally a member
        of the assembled documentation-role set. A path outside the set, a
        traversal attempt and a case or separator variation are all simply
        absent from that set and are refused with 404 before any file is
        opened. A document whose bytes no longer hash to the digest the bundle
        recorded is refused with 409 rather than served, because bytes that
        disagree with the recorded manifest correspond to no version at all.
      responses: {'200': {description: the document, its digest and the channel and version it belongs to, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerDocumentResponse'}}}}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '405': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
components:
  securitySchemes:
    iapOwner: {type: apiKey, in: header, name: X-Goog-Authenticated-User-Email}
    runnerSession: {type: apiKey, in: header, name: X-Agentic-Runner-Session}
    reconcileScheduler: {type: apiKey, in: header, name: X-Goog-Authenticated-User-Email}
  responses:
    Error: {description: error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    OwnerDocumentIndexResponse:
      type: object
      additionalProperties: false
      required: [schema_version, channel, release_version, docs_digest, allowlist_source, documents]
      properties:
        schema_version: {type: string}
        channel: {type: string, description: 'the channel the release package resolved for this process: stable when a Stable route is recorded, preview otherwise; never a literal'}
        release_version: {type: string, description: 'the version of the contract this process assembled, read from the same observer GET /v1/release/state reads, so the two cannot disagree about which version the documents describe'}
        docs_digest: {type: string}
        allowlist_source: {type: string, description: 'states that the served set is derived from the assembled bundle and answered by set membership, so a reader is never left to assume the handler joins a caller-supplied path onto a root'}
        documents: {type: array, items: {$ref: '#/components/schemas/OwnerDocumentEntry'}}
    OwnerDocumentEntry:
      type: object
      additionalProperties: false
      required: [path, sha256, route]
      properties: {path: {type: string}, sha256: {type: string}, route: {type: string, description: 'the route that serves this document, so a caller never has to construct one'}}
    OwnerDocumentResponse:
      type: object
      additionalProperties: false
      required: [path, channel, release_version, sha256, size_bytes, content]
      properties: {path: {type: string}, channel: {type: string}, release_version: {type: string}, sha256: {type: string}, size_bytes: {type: integer}, content: {type: string}}
    ReleaseRefusal:
      type: object
      additionalProperties: false
      required: [kind, reason]
      properties:
        kind: {type: string, description: one of the twelve promotion refusal classes, kept distinct so an empty capability set is not reported as a missing digest}
        capability: {type: string, description: present only for the two per-capability refusal classes}
        reason: {type: string}
    ReleaseCondition:
      type: object
      additionalProperties: false
      required: [id, contract_text, state, reason, decided_by]
      properties:
        id: {type: string, description: the numbered condition id from release-contract.md section 4}
        contract_text: {type: string, description: the condition's own sentence from the release contract}
        state: {type: string, enum: [met, unmet, not-observable-here]}
        reason: {type: string}
        decided_by: {type: array, items: {type: string}, description: the named sources that decided this condition}
        refusals: {type: array, items: {$ref: '#/components/schemas/ReleaseRefusal'}}
    ReleaseCandidateIdentity:
      type: object
      additionalProperties: false
      required: [candidate_id, candidate_digest, bundle_digest, contract_digest, docs_digest, evidence_digest]
      properties:
        candidate_id: {type: string}
        candidate_digest: {type: string}
        bundle_digest: {type: string}
        contract_digest: {type: string}
        docs_digest: {type: string}
        evidence_digest: {type: string}
    ReleaseRoute:
      type: object
      additionalProperties: false
      required: [recorded, source, rollback_available, generation]
      properties:
        recorded: {type: boolean, description: false when this process has recorded no route; no field is then defaulted or inferred}
        source: {type: string, description: states that the reported route is this process's own recorded route}
        note: {type: string, description: present when no route was recorded}
        repository: {type: string}
        preview_digest: {type: string}
        stable_digest: {type: string}
        rollback_target_digest: {type: string, description: the previous stable route target; empty once a rollback has consumed it}
        rollback_available: {type: boolean}
        generation: {type: integer, minimum: 0}
    ReleaseRollbackRecord:
      type: object
      additionalProperties: false
      required: [repository, from, to, at]
      properties:
        repository: {type: string}
        from: {type: string}
        to: {type: string}
        reason: {type: string}
        at: {type: string}
    ReleaseRetention:
      type: object
      additionalProperties: false
      required: [requirements_examined, scan_bounded, page_size, more_requirements_exist, rollback_target_referenced, rollback_target_compared_against]
      properties:
        requirements_examined: {type: integer, minimum: 0}
        scan_bounded: {type: boolean}
        page_size: {type: integer, minimum: 1, maximum: 100}
        more_requirements_exist: {type: boolean}
        rollback_target_referenced: {type: boolean}
        rollback_target_compared_against: {type: array, items: {type: string}}
        referencing_requirement_ids: {type: array, items: {type: string}}
    ReleaseStateResponse:
      type: object
      additionalProperties: false
      required: [schema_version, environment_class, release_version, candidate, assembled_at, version_source, conditions, promotable, declared_capabilities, capabilities_without_evidence, route, rollback_history, retention, not_observed, residual_gaps]
      properties:
        schema_version: {const: v1}
        environment_class: {type: string, description: the declared Preview environment grade, e.g. preview-local or preview-gcp}
        release_version: {type: string}
        candidate: {$ref: '#/components/schemas/ReleaseCandidateIdentity'}
        assembled_at: {type: string}
        version_source: {type: string, description: states that the version comes from the source manifest this process was assembled from, and that no Cloud Run revision, deployed image or update channel pointer is read}
        conditions: {type: array, items: {$ref: '#/components/schemas/ReleaseCondition'}, minItems: 8, maxItems: 8}
        promotable: {type: boolean, description: true only when all eight conditions are met, so a not-observable-here condition keeps it false}
        declared_capabilities: {type: array, items: {type: string}}
        capabilities_without_evidence: {type: array, items: {type: string}}
        route: {$ref: '#/components/schemas/ReleaseRoute'}
        rollback_history: {type: array, items: {$ref: '#/components/schemas/ReleaseRollbackRecord'}}
        retention: {$ref: '#/components/schemas/ReleaseRetention'}
        not_observed: {type: array, items: {type: string}, minItems: 1, description: what this environment class cannot observe, including the Cloud Run running revision, the deployed image digest, the deploy path, the IAP authentication boundary and scale-to-zero}
        residual_gaps: {type: array, items: {type: string}, description: named parts of cap-preview-operation and cap-stable-promotion this surface does not make observable}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, schema_version]
      properties: {status: {const: ok}, schema_version: {const: v1}}
    Error:
      type: object
      additionalProperties: false
      required: [error, message, schema_version, correlation_id]
      properties:
        error: {type: string}
        message: {type: string}
        schema_version: {const: v1}
        correlation_id: {type: string}
    CaptureRequest:
      type: object
      additionalProperties: false
      required: [request_id, text]
      properties: {request_id: {type: string}, requirement_id: {type: string}, text: {type: string}, repository_id: {type: string, description: 'optional loop-issued repository id; when present the capture writes the write-once Requirement-to-Repository link and the Repository must be registered and not retired'}}
    RunnerEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [runner_id]
      properties: {runner_id: {type: string}}
    RunnerChallengeRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token, public_key]
      properties: {enrollment_token: {type: string}, public_key: {type: string, description: base64 Ed25519 public key}}
    RunnerCompleteRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, signature]
      properties: {challenge_id: {type: string}, signature: {type: string, description: base64url Ed25519 signature}}
    AllocationLimitRequest:
      type: object
      additionalProperties: false
      required: [installation_concurrent_executions]
      description: |
        The installation-wide concurrency limit this Control Intent revision
        declares. It is additive and optional: a request that omits the object
        stores no limit and leaves the effective limit alone. It is NOT a
        control mode -- the mode field keeps its existing seven values -- and no
        permit decision reads it. The range is the docs/architecture/validation.md
        section 5 concurrent-Execution ceiling; 0 is rejected rather than treated
        as a stop, because a stop must go through the mode whose blast radius the
        stop matrix measures.
      properties: {installation_concurrent_executions: {type: integer, minimum: 1, maximum: 20}}
    ControlRequest:
      type: object
      additionalProperties: false
      required: [request_id, scope_kind, scope_value, mode]
      properties: {request_id: {type: string}, scope_kind: {type: string}, scope_value: {type: string}, mode: {type: string}, reason: {type: string}, allocation_limit: {$ref: '#/components/schemas/AllocationLimitRequest'}}
    ClaimRequest:
      type: object
      additionalProperties: false
      required: [request_id, increment_id, expected_increment_version, control_revision]
      properties: {request_id: {type: string}, increment_id: {type: string}, expected_increment_version: {type: integer}, control_revision: {type: integer}, target: {$ref: '#/components/schemas/Target'}}
    PermitRequest:
      type: object
      additionalProperties: false
      required: [request_id, kind, control_revision, fencing_token, resource]
      properties: {request_id: {type: string}, kind: {type: string}, control_revision: {type: integer}, fencing_token: {type: integer}, expected_fencing_token: {type: integer}, resource: {type: string}, target: {$ref: '#/components/schemas/Target'}}
    ResultRequest:
      type: object
      additionalProperties: false
      required: [request_id, execution_id, lease_id, expected_execution_version, fencing_token, control_revision, succeeded]
      description: |
        provider_observation is additive and optional (V2-067). The result the
        Runner already posts is the carrier because the ledger and the CLIs
        live on the Runner machine while the registry lives in the control
        plane, so the control plane cannot read the ledger and any design that
        pretended otherwise would be a fiction. No new endpoint, no new
        authenticator and no new idempotency story is introduced.
      properties: {request_id: {type: string}, execution_id: {type: string}, lease_id: {type: string}, expected_execution_version: {type: integer}, fencing_token: {type: integer}, control_revision: {type: integer}, succeeded: {type: boolean}, target: {$ref: '#/components/schemas/Target'}, provider_observation: {$ref: '#/components/schemas/ProviderObservation'}}
    RequestedBy:
      type: object
      description: >-
        Who caused this Requirement intake or Control Intent: an owner acting
        through an authenticated session (local dev session subject, or IAP
        subject in production), or the Loop deciding on its own. subject is
        an identity reference for attribution only, never a credential.
      additionalProperties: false
      required: [actor_type, subject]
      properties: {actor_type: {type: string, enum: [owner, loop]}, subject: {type: string}}
    CaptureResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, version, requested_by]
      properties: {requirement_id: {type: string}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, repository_id: {type: string, description: 'present only when this capture actually wrote a Requirement-to-Repository link; omitted entirely when the Requirement names no Repository'}}
    RequirementResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version, increment_ids, increments, increments_truncated, next_action, release_reflection]
      description: |
        One Backlog row. The four fields V2-095 added -- increments,
        increments_truncated, next_action and release_reflection -- are
        cap-backlog-visibility's declared confirmation items 進行中Incrementと
        進捗, 次のaction and Preview/Stable反映状況. increment_ids is unchanged
        in name, type and meaning and still carries every Increment id the
        aggregate holds; increments carries the id AND the status of each
        Increment actually read, and increments_truncated says the page-wide
        Increment budget cut this row, so a short increments list is never
        readable as a complete one.
      properties: {requirement_id: {type: string}, status: {type: string}, version: {type: integer}, increment_ids: {type: array, items: {type: string}}, text: {type: string}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, repository_id: {type: string, description: 'the Repository this Requirement is linked to; omitted entirely when no link exists, never reported as an empty or defaulted value'}, captured_at: {type: string, format: date-time, description: 'the instant this Requirement was captured, taken from the transaction authority time at intake; omitted entirely for a Requirement recorded before the field existed, never reported as the zero instant'}, increments: {type: array, items: {$ref: '#/components/schemas/RequirementRowIncrement'}}, increments_truncated: {type: boolean, description: 'the page-wide Increment budget bound THIS row, so both increments and next_action describe a bounded set'}, next_action: {type: string, description: 'computed by the same function the detail view uses, over the Increments and Executions actually read for this row'}, release_reflection: {$ref: '#/components/schemas/RequirementReleaseReflection'}}
    RequirementRowIncrement:
      type: object
      additionalProperties: false
      required: [increment_id, status]
      description: |
        One Increment as a Backlog row reports it: the id and the status, and
        nothing else. It deliberately carries no Execution list, because a
        per-row Execution list on a page of up to a hundred rows is how a
        bounded owner read becomes an unbounded one.
      properties: {increment_id: {type: string}, status: {type: string}}
    RequirementReleaseReflection:
      type: object
      additionalProperties: false
      required: [observed, reason]
      description: |
        The Preview/Stable reflection of one Requirement, projected from the
        Requirement's own recorded Stable release snapshot with no additional
        read. observed is false when no snapshot is recorded, and then EVERY
        identifier is omitted and reason says why: an owner must be able to tell
        'this Requirement is in no release' from 'we did not look'. A zero
        snapshot is never reported as a plausible release.
      properties: {observed: {type: boolean}, reason: {type: string}, release_id: {type: string}, release_version: {type: integer}, bundle_digest: {type: string}, evidence_digest: {type: string}}
    RequirementListResponse:
      type: object
      additionalProperties: false
      required: [requirements]
      properties: {requirements: {type: array, items: {$ref: '#/components/schemas/RequirementResponse'}}}
    RequirementPageResponse:
      type: object
      additionalProperties: false
      required: [requirements, page_size, truncated]
      properties: {requirements: {type: array, items: {$ref: '#/components/schemas/RequirementResponse'}}, next_cursor: {type: string}, page_size: {type: integer}, truncated: {type: boolean, description: 'the per-page Increment budget bound this answer, so some row read a bounded Increment set; it follows RequirementDetailResponse.truncated exactly'}, filter: {$ref: '#/components/schemas/RequirementPageFilter'}}
    RequirementPageFilter:
      type: object
      additionalProperties: false
      required: [repository_id, linked_ids_read, linked_ids_bounded, bound, reason, missing_requirements]
      description: |
        The repository_id filter, reported back so an empty page caused by an
        unknown Repository can be told from an empty page caused by an
        exhausted cursor, and so the bound the Requirement-to-Repository link
        query already reports is surfaced rather than hidden. It is OMITTED
        ENTIRELY on an unfiltered page: an absent filter is reported as absent,
        never as a filter on the empty string.
      properties: {repository_id: {type: string}, linked_ids_read: {type: integer}, linked_ids_bounded: {type: boolean, description: 'true means the storage query bound truncated the id set, so linked_ids_read is a LOWER BOUND and not an exact total'}, bound: {type: integer}, reason: {type: string}, missing_requirements: {type: integer, description: 'link rows whose Requirement could not be read back in the same transaction; reported rather than hidden, because dropping one silently would make the page size lie'}}
    RequirementDetailResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version, increments, next_action, page_size, truncated]
      properties: {requirement_id: {type: string}, original_text: {type: string}, status: {type: string}, version: {type: integer}, increments: {type: array, items: {type: object}}, next_action: {type: string}, page_size: {type: integer, maximum: 100}, truncated: {type: boolean}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, repository_id: {type: string, description: 'the Repository this Requirement is linked to; omitted entirely when no link exists'}, captured_at: {type: string, format: date-time, description: 'the instant this Requirement was captured, taken from the transaction authority time at intake; omitted entirely for a Requirement recorded before the field existed, never reported as the zero instant'}, needs_input: {$ref: '#/components/schemas/NeedsInputQuestion'}, resumes_to: {type: string, description: 'the status a resume would restore this Requirement to, read from the paused record itself; OMITTED ENTIRELY unless the status is paused, and omitted for a paused Requirement stored before the field existed, which has no origin to restore and is cancel-only'}}
    HumanInputOption:
      type: object
      additionalProperties: false
      required: [option_id, summary, impact]
      properties:
        option_id: {type: string, maxLength: 64}
        summary: {type: string, maxLength: 300}
        impact: {type: string, maxLength: 300, description: 'what choosing this option does; mandatory, so an option cannot be offered with no stated consequence'}
    HumanInputScope:
      type: string
      enum: [new-claims-for-this-requirement, lease-renewal-for-this-requirement, other-requirements, intake-of-new-requirements, owner-reads]
    NeedsInputQuestion:
      type: object
      additionalProperties: false
      required: [requirement_id, question, reason_class, reason, options, stopped_scope, continuing_scope, asked_at, asked_by]
      description: |
        The question recorded for a Requirement in needs-input. The whole
        object is omitted from the Requirement detail when no question was
        recorded, including for a Requirement whose status is needs-input: no
        question is ever synthesised from the status alone.
      properties:
        requirement_id: {type: string}
        question: {type: string, maxLength: 500}
        reason_class: {type: string, enum: [destructive-irreversible, limit-change, ambiguous-requirement]}
        reason: {type: string, maxLength: 1000}
        options: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/HumanInputOption'}}
        stopped_scope: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/HumanInputScope'}, description: 'what stops until the question is answered; the entries new-claims-for-this-requirement and lease-renewal-for-this-requirement are each backed by an actual refusal in the issuing path'}
        continuing_scope: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/HumanInputScope'}}
        asked_at: {type: string, format: date-time}
        asked_by: {$ref: '#/components/schemas/RequestedBy'}
        answered_at: {type: string, format: date-time, description: 'omitted entirely while the question is unanswered'}
        answered_option_id: {type: string, maxLength: 64, description: 'omitted entirely while the question is unanswered'}
        answered_by: {$ref: '#/components/schemas/RequestedBy'}
    RequestHumanInputRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_requirement_version, question, reason_class, reason, options, stopped_scope, continuing_scope]
      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
        question: {type: string, maxLength: 500}
        reason_class: {type: string, enum: [destructive-irreversible, limit-change, ambiguous-requirement]}
        reason: {type: string, maxLength: 1000}
        options: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/HumanInputOption'}}
        stopped_scope: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/HumanInputScope'}}
        continuing_scope: {type: array, minItems: 1, maxItems: 8, items: {$ref: '#/components/schemas/HumanInputScope'}}
    RequestHumanInputResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version, asked_at, asked_by]
      properties:
        requirement_id: {type: string}
        status: {type: string}
        version: {type: integer}
        asked_at: {type: string, format: date-time}
        asked_by: {$ref: '#/components/schemas/RequestedBy'}
    AnswerHumanInputRequest:
      type: object
