        a caller.
      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
    CancelRequirementResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version]
      properties:
        requirement_id: {type: string, description: 'the SAME Requirement; cancelling creates nothing'}
        status: {type: string, description: 'cancelled, which is terminal'}
        version: {type: integer}
    ControlRead:
      type: object
      additionalProperties: false
      required: [scope, mode, revision, requested, acknowledged, effective, verified]
      properties: {scope: {type: object}, mode: {type: string}, revision: {type: integer}, requested: {type: boolean}, acknowledged: {type: boolean}, effective: {type: boolean}, verified: {type: boolean}, requested_by: {$ref: '#/components/schemas/RequestedBy'}}
    ControlReadListResponse:
      type: object
      additionalProperties: false
      required: [controls]
      properties: {controls: {type: array, items: {$ref: '#/components/schemas/ControlRead'}}}
    QueueSummary:
      type: object
      additionalProperties: false
      required: [requirements, by_requirement_status, increments, by_increment_status, active_executions]
      properties: {requirements: {type: integer}, by_requirement_status: {type: object}, increments: {type: integer}, by_increment_status: {type: object}, active_executions: {type: integer}}
    QueueAllocation:
      type: object
      additionalProperties: false
      required: [limit, limit_source, control_revision, active, remaining, planned_assignments]
      description: |
        What the scheduler is allowed to allocate and what it actually planned
        for this read. limit_source names where the number came from, so a
        design ceiling is never shown as though an owner had chosen it, and
        control_revision names the Control Intent revision that declared it (0
        when none has). planned_assignments is the length of the plan the
        scheduler returned in this transaction and nothing else: it is never the
        active Execution count reported as an allocation. The plan is never
        applied by this read.
      properties: {limit: {type: integer, minimum: 1}, limit_source: {type: string, enum: [architecture-design-ceiling, control-revision]}, control_revision: {type: integer, minimum: 0}, active: {type: integer, minimum: 0}, remaining: {type: integer, minimum: 0}, planned_assignments: {type: integer, minimum: 0}}
    QueueWaiting:
      type: object
      additionalProperties: false
      required: [total, by_reason]
      description: |
        Why the candidates the scheduler considered are not running. The
        by_reason keys are the scheduler's own closed reason set, projected
        without a second vocabulary, and every one of them is reported on every
        read -- zero included -- so the key order is fixed and the closed set is
        visible. total is the number of considered candidates that were not
        assigned and equals the sum of the buckets.
      properties: {total: {type: integer, minimum: 0}, by_reason: {type: object, additionalProperties: false, required: [not-ready, unmet-dependency, repository-unavailable, already-owned, resource-conflict, no-runner-capacity, not-executable], properties: {not-ready: {type: integer, minimum: 0}, unmet-dependency: {type: integer, minimum: 0}, repository-unavailable: {type: integer, minimum: 0}, already-owned: {type: integer, minimum: 0}, resource-conflict: {type: integer, minimum: 0}, no-runner-capacity: {type: integer, minimum: 0}, not-executable: {type: integer, minimum: 0}}}}
    QueueExhaustion:
      type: object
      additionalProperties: false
      required: [exhausted, binding_limit]
      description: |
        The capacity verdict, computed from the snapshot's own capacity
        accounting and never by re-reading a candidate's rejection reason: a
        candidate can be waiting on a resource conflict while capacity remains.
        binding_limit names installation-concurrency when the number reached was
        one an owner declared, and runner-capacity when it was the pool's own
        capacity.
      properties: {exhausted: {type: boolean}, binding_limit: {type: string, enum: [none, installation-concurrency, runner-capacity]}}
    QueueSummaryResponse:
      type: object
      additionalProperties: false
      required: [requirements, by_requirement_status, increments, by_increment_status, active_executions, allocation, waiting, exhaustion, priority]
      description: |
        The GET /v1/queue/summary body. The five counter fields are the
        QueueSummary schema's own fields, unchanged in name, type and meaning;
        they are restated here rather than composed with allOf because
        QueueSummary is declared with additionalProperties:false and is also
        published as RepositoryBacklogView.installation_scope, where the three
        allocation objects are not computed and must not appear as empty
        placeholders.
      properties: {requirements: {type: integer}, by_requirement_status: {type: object}, increments: {type: integer}, by_increment_status: {type: object}, active_executions: {type: integer}, allocation: {$ref: '#/components/schemas/QueueAllocation'}, waiting: {$ref: '#/components/schemas/QueueWaiting'}, exhaustion: {$ref: '#/components/schemas/QueueExhaustion'}, priority: {$ref: '#/components/schemas/QueuePriority'}}
    QueuePriority:
      type: object
      additionalProperties: false
      required: [bounded, reason, candidates_ranked, candidate_bound, assessment_supplied, assessment_note, entries]
      description: |
        cap-backlog-visibility's declared confirmation item 優先度とその根拠,
        reported as a PROJECTION of the per-candidate decisions the scheduler
        already returned for this read. It adds no read at all: no second page,
        no second Decide call and no per-row read. A Requirement the scheduler
        did not rank carries NO entry, and bounded plus reason say so, so an
        unranked Requirement is never given a plausible rank.
        assessment_supplied reports whether any candidate carried a multi-factor
        priority assessment; it is false at this release because the allocation
        snapshot supplies none, and that is stated rather than hidden.
      properties: {bounded: {type: boolean}, reason: {type: string}, candidates_ranked: {type: integer}, candidate_bound: {type: integer}, assessment_supplied: {type: boolean}, assessment_note: {type: string}, entries: {type: array, items: {$ref: '#/components/schemas/QueuePriorityEntry'}}}
    QueuePriorityEntry:
      type: object
      additionalProperties: false
      required: [requirement_id, rank, assigned, score, score_inputs]
      description: |
        One candidate's own decision. reason is present only when assigned is
        false, and is always a member of the scheduler's closed rejection set --
        the same projection the waiting histogram uses, so the two can never
        name different vocabularies.
      properties: {requirement_id: {type: string}, rank: {type: integer, description: '0 is highest, in the sorted candidate order the scheduler itself produced'}, assigned: {type: boolean}, reason: {type: string, enum: [not-ready, unmet-dependency, repository-unavailable, already-owned, resource-conflict, no-runner-capacity, not-executable]}, score: {type: integer}, score_inputs: {$ref: '#/components/schemas/QueuePriorityScoreInputs'}}
    QueuePriorityScoreInputs:
      type: object
      additionalProperties: false
      required: [used_assessment, priority, age_seconds]
      description: |
        The factors the scheduler ACTUALLY used for this candidate, not the
        factors it could have used. factors is OMITTED ENTIRELY when
        used_assessment is false, because the seven factor values are zero in
        that branch and seven reported zeroes would read as seven measured
        zeroes.
      properties: {used_assessment: {type: boolean}, priority: {type: integer}, age_seconds: {type: integer}, factors: {$ref: '#/components/schemas/QueuePriorityFactors'}}
    QueuePriorityFactors:
      type: object
      additionalProperties: false
      required: [value_score, urgency_score, risk_score, dependency_score, learning_score, resource_cost, starvation_risk]
      properties: {value_score: {type: integer}, urgency_score: {type: integer}, risk_score: {type: integer}, dependency_score: {type: integer}, learning_score: {type: integer}, resource_cost: {type: integer}, starvation_risk: {type: integer}}
    ExportRecord:
      type: object
      additionalProperties: false
      required: [schema_version, kind, digest, value]
      properties: {schema_version: {const: v1}, kind: {type: string, enum: [requirement, control, event]}, digest: {type: string, pattern: '^sha256:'}, value: {type: object}}
    ExportResponse:
      type: object
      additionalProperties: false
      required: [schema_version, records]
      properties: {schema_version: {const: v1}, records: {type: array, maxItems: 300, items: {$ref: '#/components/schemas/ExportRecord'}}}
    ControlResponse:
      type: object
      additionalProperties: false
      required: [revision, mode, requested_by]
      properties: {revision: {type: integer}, mode: {type: string}, state: {type: string, enum: [requested, acknowledged, effective, verified]}, requested_by: {$ref: '#/components/schemas/RequestedBy'}}
    OfferedWorkResponse:
      type: object
      additionalProperties: false
      required: [schema_version, cap, increments]
      properties: {schema_version: {type: string}, cap: {type: integer}, increments: {type: array, items: {$ref: '#/components/schemas/OfferedIncrement'}}}
    OfferedIncrement:
      type: object
      additionalProperties: false
      required: [requirement_id, increment_id, expected_increment_version, requirement_summary]
      properties: {requirement_id: {type: string}, increment_id: {type: string}, expected_increment_version: {type: integer}, requirement_summary: {type: string, minLength: 1, maxLength: 262144}}
    ClaimResponse:
      type: object
      additionalProperties: false
      required: [increment_id, execution_id, lease_id, runner_id, version, fencing_token]
      properties: {increment_id: {type: string}, execution_id: {type: string}, lease_id: {type: string}, runner_id: {type: string}, version: {type: integer}, fencing_token: {type: integer}}
    PermitResponse:
      type: object
      additionalProperties: false
      required: [allowed, revision, reason]
      properties: {allowed: {type: boolean}, revision: {type: integer}, reason: {type: string}}
    ResultResponse:
      type: object
      additionalProperties: false
      required: [execution_id, status, version]
      properties: {execution_id: {type: string}, status: {type: string}, version: {type: integer}}
    LifecycleResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties: {accepted: {type: boolean}, applied_revision: {type: integer}, latest_revision: {type: integer}, latest_effective_at: {type: string, format: date-time}, process_observations: {type: array, items: {$ref: '#/components/schemas/ProcessObservation'}}, latest_mode: {type: string}}
    RenewResponse:
      type: object
      additionalProperties: false
      required: [lease_id, expires_at, version]
      properties: {lease_id: {type: string}, expires_at: {type: string, format: date-time}, version: {type: integer}}
    StartResponse:
      type: object
      additionalProperties: false
      required: [execution_id, status, version]
      properties: {execution_id: {type: string}, status: {type: string}, version: {type: integer}}
    Target:
      type: object
      additionalProperties: false
      properties:
        installation_id: {type: string}
        repository_id: {type: string}
        requirement_id: {type: string}
        increment_id: {type: string}
        runner_id: {type: string}
        channel: {type: string}
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties: {request_id: {type: string}, control_revision: {type: integer}, process_observations: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ProcessObservation'}}, runner_version: {$ref: '#/components/schemas/RunnerVersionReport'}}
    RunnerVersionReport:
      type: object
      additionalProperties: false
      required: [version, binary_sha256, schema_min, schema_max]
      description: |
        The version the reporting Runner is actually running: the binary
        coordinates and the closed canonical schema interval of
        docs/operations/self-update.md section 5.1 items 1 and 2. All four
        fields are required: a partial object is refused with 400 and stores
        nothing, because an interval carrying only its upper endpoint would be
        stored as one starting at zero, which reads as wider than anything the
        machine can do. The object carries no timestamp field, so a Runner
        clock cannot enter the record; reported_at is the transaction's
        authority time. It carries no contract_release, contract_digest,
        runner_api range, bundle_digest, candidate_id, key_id or algorithm,
        not even as an empty placeholder. The Control Plane validates shape
        only and never treats the claim as authority over what this Runner may
        read.
      properties: {version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?$'}, binary_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}, schema_min: {type: integer, minimum: 1, maximum: 4096}, schema_max: {type: integer, minimum: 1, maximum: 4096}}
    RunnerVersionRow:
      type: object
      additionalProperties: false
      required: [runner_id, report_state]
      description: |
        One Runner's row. report_state is reported, not-reported or stale, and
        the coordinates are present only when a report was actually read: a
        Runner that has not reported carries no version, no binary digest and
        no interval at all rather than a synthesized default.
      properties: {runner_id: {type: string}, report_state: {type: string, enum: [reported, not-reported, stale]}, version: {type: string}, binary_sha256: {type: string}, schema_min: {type: integer}, schema_max: {type: integer}, reported_at: {type: string, format: date-time, description: server-authoritative report time}}
    RunnerListResponse:
      type: object
      additionalProperties: false
      required: [runners, runner_count, truncated, intersection_state]
      description: |
        intersection_state is unknown whenever any enumerated Runner is not in
        state reported, whenever no Runner is known, and whenever truncated is
        true; the endpoints are present only when the state is non-empty,
        because an empty or unknown intersection is not an interval.
      properties: {runners: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/RunnerVersionRow'}}, runner_count: {type: integer, minimum: 0}, truncated: {type: boolean, description: 'the bounded enumeration hit its limit, so runner_count is a lower bound and the intersection is unknown'}, intersection_state: {type: string, enum: [non-empty, empty, unknown]}, intersection_schema_min: {type: integer}, intersection_schema_max: {type: integer}}
    ProviderObservation:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        What the reporting Runner observed about the Provider it just drove.
        Exactly three fields exist and no more: a Provider name, an optional
        closed failure class and an optional boolean. There is no message,
        detail, output, result, session or text field anywhere on it, so a
        prompt, a raw provider response and credential material are
        structurally unrepresentable rather than filtered -- no redaction step
        can be forgotten, because there is no field to forget. There is no
        timestamp field either, so a Runner clock cannot enter the record;
        observed_at is the transaction's authority time.
        An absent object records nothing. A present object naming anything
        other than codex, claude or opencode is refused with 400 and records
        nothing, and so is a failure_class outside the closed enum.
        stopped_for_inspection true means the runner-local runaway detector
        stopped this invocation for inspection. That is neither a success nor
        a failure: it is reported as its own health value and its own
        detection state, and it is counted in no failure tally.
      properties:
        name: {type: string, enum: [codex, claude, opencode]}
        failure_class: {type: string, enum: [provider-unauthenticated, provider-transport, provider-rate-limited, timeout, provider-model, contract-incompatible, unknown], description: 'the class of a failed invocation; absent means the invocation completed'}
        stopped_for_inspection: {type: boolean}
    ProviderAssignment:
      type: object
      additionalProperties: false
      required: [execution_id, increment_id, since]
      description: |
        One Execution currently assigned to this Provider. The assignment is a
        side table keyed by Execution id; the Execution aggregate itself gains
        no Provider field. An Execution that has reached a terminal status is
        not reported here.
      properties: {execution_id: {type: string}, increment_id: {type: string}, since: {type: string, format: date-time, description: server-authoritative instant the assignment was written}}
    ProviderRunawayDetection:
      type: object
      additionalProperties: false
      required: [scope, state, thresholds_declared_in]
      description: |
        The runner-local runaway detector, reported by state alone. There is
        deliberately no number in this object. The thresholds live in the
        owner-approved, digest-bound provider-preflight record that
        thresholds_declared_in names; republishing them here would create a
        second copy of a safety threshold that can silently disagree with the
        approved one.
        state is within-thresholds only when a fresh observation reported no
        stop. It is unknown when nothing has been observed, and also when the
        newest observation reporting no stop is older than the declared
        window, because a detector that was within its thresholds a day ago is
        not a statement about now. A stop for inspection is reported whatever
        its age: a stop that aged out into silence would be a stop nobody was
        told about.
      properties: {scope: {type: string, description: 'who owns the detector; runner-local, because the ledger and the CLIs are on the Runner machine and the control plane cannot read them'}, state: {type: string, enum: [within-thresholds, stopped-for-inspection, unknown]}, thresholds_declared_in: {type: string, description: 'names the approved record the thresholds live in and copies none of them'}}
    ProviderConcurrency:
      type: object
      additionalProperties: false
      required: [active_assignments, declared_ceiling, ceiling_source, remaining, exhausted]
      description: |
        The concurrent-Execution allocation the control plane genuinely owns.
        ceiling_source names which ceiling is being reported, so a design
        ceiling is never shown as though an owner had chosen it.
        active_assignments counts the retained assignments whose Execution has
        not reached a terminal status; the retention bound is larger than the
        ceiling, so exceeding the ceiling is reportable before the bound
        truncates. remaining is never negative.
      properties: {active_assignments: {type: integer, minimum: 0}, declared_ceiling: {type: integer, minimum: 0}, ceiling_source: {type: string, enum: [architecture-design-ceiling, owner-declared]}, remaining: {type: integer, minimum: 0}, exhausted: {type: boolean}}
    ProviderVersionInterval:
      type: object
      additionalProperties: false
      required: [from, until]
      description: |
        A half-open interval of versions: from is included, until is excluded.
        It is a declaration this repository owns and never a measurement of a
        real CLI. A closed upper bound would have to name the last version that
        works, which nobody can know before it exists.
        Neither bound is a threshold and neither is a ceiling.
      properties: {from: {type: string, description: 'the included lower bound, in the declared semver shape'}, until: {type: string, description: 'the excluded upper bound, in the declared semver shape'}}
    ProviderCompatibility:
      type: object
      additionalProperties: false
      required: [cli_version_interval, loop_version_interval, observed_loop_version, cli_compatibility, loop_compatibility]
      description: |
        Compatibility is TWO relations, both named, neither collapsed into the
        other. cli_version_interval is the interval of Provider CLI versions the
        adapter declares support for -- the relation is between the version and
        the thing that breaks, and the thing that breaks is an adapter, because
        it is the adapter that emits the argv and the adapter whose envelope
        shape is parsed. loop_version_interval is the interval of Loop release
        identities that carry that adapter contract. A relation from a Provider
        CLI version directly to a Loop version is deliberately not defined: two
        Loop versions carrying byte-identical adapters would then report
        different compatibility, which is false.
        Both intervals are read from source. No self-claim is authority for
        either: not a version a CLI reports about itself, not a version a
        Provider prints inside a response envelope, and not a Runner's
        self-report.
        observed_loop_version is the empty string when this process was given no
        explicit release source root and can report no release version. No
        version is synthesized for that absence, and loop_compatibility is then
        unknown.
        There is deliberately no observed_cli_version field. No observed
        Provider CLI version is transported to the control plane at all, so
        cli_compatibility is unknown unless the Loop's own execution path has
        observed a contract-incompatible failure for this Provider.
        unknown is a sibling value of compatible in the same closed set, never a
        default and never blank. A reader who takes unknown as compatible would
        be wrong; that neither interval has been shown true of a real CLI is
        established by no part of this API.
      properties:
        cli_version_interval: {$ref: '#/components/schemas/ProviderVersionInterval'}
        loop_version_interval: {$ref: '#/components/schemas/ProviderVersionInterval'}
        observed_loop_version: {type: string, description: 'the Loop release identity this process was assembled from, or the empty string when it can report none'}
        cli_compatibility: {type: string, enum: [compatible, incompatible, unknown]}
        loop_compatibility: {type: string, enum: [compatible, incompatible, unknown]}
    ProviderHandoff:
      type: object
      additionalProperties: false
      required: [disposition, target, waiting_reason]
      description: |
        What a single declared decision function says about this Provider now.
        The decision triggers on the source being not-sendable -- the circuit
        not sending, or the usage window exhausted, or the pool slot needing an
        owner action -- and filters candidates by the owner's standing
        authorization, by declared compatibility and by the attempt history for
        the Increment the source is carrying.
        disposition is none when nothing needs to move, handoff-proposed when a
        target was selected, and waiting when work must move but nothing may
        receive it. target is the empty string unless the disposition is
        handoff-proposed, and waiting_reason is the empty string unless it is
        waiting.
        handoff-proposed is a PROPOSAL an owner reads. Nothing in this
        repository executes it: no Provider selection loop exists on the
        production path, so this surface does not mean that work has moved or
        will move. Reading it changes nothing.
        The waiting reasons here are a different vocabulary from the queue
        waiting reasons on the shared-allocation surface, and the two share no
        member, so one can never be read as the other.
      properties:
        disposition: {type: string, enum: [none, handoff-proposed, waiting]}
        target: {type: string, enum: ['', codex, claude, opencode], description: 'the proposed target Provider, or the empty string when the disposition is not handoff-proposed'}
        waiting_reason: {type: string, enum: ['', source-is-probing, chain-bound-reached, candidate-needs-an-owner-action, candidate-is-measured-incompatible, candidate-already-tried-for-this-increment, candidate-is-not-sendable]}
    ProviderRegistryEntry:
      type: object
      additionalProperties: false
      required: [provider, authorized, authorization_ref, verified_by_loop_invocation, health, blocked_reason, last_observed_at, observation_count, stale, runaway_detection, concurrency, assignments, compatibility, handoff]
      description: |
        One Provider's row.
        authorized and verified_by_loop_invocation are two independent facts.
        authorized is the owner's in-repository standing authorization, which
        authorization_ref names by record id; verified_by_loop_invocation is
        whether the Loop has ever completed an invocation through this
        Provider. They disagree today for two of the three Providers, and when
        authorized is true and verified_by_loop_invocation is false the health
        is unauthenticated or unknown and blocked_reason names the action a
        human must take. No agent can take it: authenticating a CLI uses the
        owner's own identity.
        authorization_ref is a record id and never a person. The approving
        person's address is not carried by this API, is not carried by the read
        model behind it, and is not written to any log line.
        blocked_reason is empty exactly when health is healthy.
        last_observed_at is the empty string when this Provider has never been
        observed; no instant is synthesized for an absence. stale is true
        whenever the newest observation is older than the declared window, and
        also whenever there is no observation at all. A stale entry keeps the
        health it was last observed to have and reports its age rather than
        being silently refreshed or silently downgraded.
        observation_count counts the retained observations that fall inside the
        declared window, so it is zero for a Provider that has never been
        observed and for one whose every retained observation has aged out.
      properties:
        provider: {type: string, enum: [codex, claude, opencode]}
        authorized: {type: boolean, description: 'the owner''s in-repository standing authorization covers this Provider'}
        authorization_ref: {type: string, description: 'the standing authorization record id, or the empty string when no authorization covers this Provider'}
        verified_by_loop_invocation: {type: boolean, description: 'the Loop has completed at least one invocation through this Provider; sticky, so a later failure never un-verifies it'}
        health: {type: string, enum: [unknown, healthy, degraded, unavailable, unauthenticated, stopped-for-inspection]}
        blocked_reason: {type: string, enum: ['', never-invoked-by-loop, owner-must-authenticate-cli-on-runner-machine, last-invocation-failed-retryably, last-invocation-failed-non-retryably, last-invocation-failed-without-a-classified-reason, owner-must-clear-the-runaway-stop-with-a-new-approved-record]}
        last_observed_at: {type: string, description: 'RFC3339 instant of the newest retained observation, or the empty string when this Provider has never been observed'}
        observation_count: {type: integer, minimum: 0}
        stale: {type: boolean}
        runaway_detection: {$ref: '#/components/schemas/ProviderRunawayDetection'}
        concurrency: {$ref: '#/components/schemas/ProviderConcurrency'}
        assignments: {type: array, maxItems: 24, items: {$ref: '#/components/schemas/ProviderAssignment'}}
        compatibility: {$ref: '#/components/schemas/ProviderCompatibility'}
        handoff: {$ref: '#/components/schemas/ProviderHandoff'}
    ProviderRegistryResponse:
      type: object
      additionalProperties: false
      required: [providers]
      description: |
        The whole registry. providers has exactly one entry per declared
        Provider, in the fixed order codex, claude, opencode, so repeated calls
        against the same stored state produce byte-identical documents.
        There is deliberately no tally of any kind here -- no failure count, no
        degraded count, no assignable count, no eligible count. A stop for
        inspection is neither a success nor a failure, so a failure tally would
        need a carve-out for it and would eventually forget it; and an
        assignable count would be a second, derived statement of what each
        entry's own health and blocked_reason already say exactly, which is how
        two numbers come to disagree.
      properties: {providers: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/ProviderRegistryEntry'}}}
    ProcessObservation:
      type: object
      additionalProperties: false
      required: [process_id, state]
      properties: {process_id: {type: string, maxLength: 128}, state: {type: string, enum: [running, checkpointed, terminated, unknown]}, at: {type: string, format: date-time, description: server-authoritative observation time}}
    CheckpointRequest:
      type: object
      additionalProperties: false
      required: [request_id, execution_id, lease_id, fencing_token, control_revision]
      properties: {request_id: {type: string}, execution_id: {type: string}, lease_id: {type: string}, fencing_token: {type: integer}, control_revision: {type: integer}}
    RegisterRepositoryRequest:
      type: object
      additionalProperties: false
      required: [request_id, source_url]
      properties: {request_id: {type: string}, repository_id: {type: string}, source_url: {type: string, description: 'raw source locator in any accepted form (https, ssh, scp-style, owner/name); parsed and normalised, never stored as the identity'}, default_branch: {type: string}}
    RetireRepositoryRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties: {request_id: {type: string}, expected_version: {type: integer}}
    ObserveRepositoryRequest:
      type: object
      additionalProperties: false
      required: [request_id, reachable]
      properties: {request_id: {type: string}, reachable: {type: boolean}, default_branch: {type: string}, can_push: {type: boolean}, forge_node_id: {type: string}, adapter_version: {type: string}, reason: {type: string, description: bounded parsed reason; never raw process output}}
    SourceLocator:
      type: object
      additionalProperties: false
      required: [forge, host, owner, name]
      properties: {forge: {const: github}, host: {type: string}, owner: {type: string}, name: {type: string}, default_branch: {type: string}}
    RepositoryExecutability:
      type: object
      additionalProperties: false
      required: [state, executable, reason]
      properties: {state: {type: string, enum: [executable, blocked, unobserved, retired]}, executable: {type: boolean}, reason: {type: string}, observed_at: {type: string, format: date-time}, stale: {type: boolean}}
    RepositoryObservation:
      type: object
      additionalProperties: false
      required: [repository_id, locator, reachable, can_push, observed_at]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, reachable: {type: boolean}, default_branch: {type: string}, can_push: {type: boolean}, forge_node_id: {type: string}, adapter_version: {type: string}, reason: {type: string}, observed_at: {type: string, format: date-time}}
    RepositoryResponse:
      type: object
      additionalProperties: false
      required: [repository_id, locator, status, version, requested_by]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, status: {type: string, enum: [registered, retired]}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}}
    RepositoryView:
      type: object
      additionalProperties: false
      required: [repository_id, locator, status, version, requested_by, executability]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, status: {type: string, enum: [registered, retired]}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, executability: {$ref: '#/components/schemas/RepositoryExecutability'}}
    RepositoryListResponse:
      type: object
      additionalProperties: false
      required: [repositories]
      properties: {repositories: {type: array, items: {$ref: '#/components/schemas/RepositoryView'}}}
    ObservedState:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties: {state: {type: string, enum: [measured, unobserved, not-implemented]}, reason: {type: string, description: why this declared observable has no measured value at this revision}}
    RepositoryBacklogView:
      type: object
      additionalProperties: false
      required: [state, reason, requirement_count]
      properties: {state: {type: string, enum: [measured, unobserved, not-implemented]}, reason: {type: string}, requirement_count: {type: integer, minimum: 0, description: 'Requirements linked to this Repository through the write-once Requirement-to-Repository association, read in this request and bounded in the storage query'}, truncated: {type: boolean, description: 'the bounded read hit its limit, so requirement_count is a lower bound and not an exact total'}, installation_scope: {$ref: '#/components/schemas/QueueSummary'}}
    RepositoryDetailResponse:
      type: object
      additionalProperties: false
      required: [repository_id, locator, status, version, requested_by, application_release, policy, requirement_backlog, runners_and_ai_resources, executability, effective_control_mode, effective_control_revision]
      properties: {repository_id: {type: string}, locator: {$ref: '#/components/schemas/SourceLocator'}, status: {type: string, enum: [registered, retired]}, version: {type: integer}, requested_by: {$ref: '#/components/schemas/RequestedBy'}, application_release: {$ref: '#/components/schemas/ObservedState'}, policy: {$ref: '#/components/schemas/ObservedState'}, requirement_backlog: {$ref: '#/components/schemas/RepositoryBacklogView'}, runners_and_ai_resources: {$ref: '#/components/schemas/ObservedState'}, executability: {$ref: '#/components/schemas/RepositoryExecutability'}, observation: {$ref: '#/components/schemas/RepositoryObservation'}, effective_control_mode: {type: string}, effective_control_revision: {type: integer}}
    ObserveRepositoryResponse:
      type: object
      additionalProperties: false
      required: [repository_id, accepted, observed_at, executability]
      properties: {repository_id: {type: string}, accepted: {type: boolean}, observed_at: {type: string, format: date-time}, executability: {$ref: '#/components/schemas/RepositoryExecutability'}}
    RenewRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_lease_version, fencing_token, control_revision]
      properties: {request_id: {type: string}, expected_lease_version: {type: integer}, fencing_token: {type: integer}, control_revision: {type: integer}}
    StartRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_execution_version, control_revision]
      description: |
        provider is additive and optional (V2-067). It names the Provider this
        Execution is about to be driven through, and start is the carrier
        because the Runner is the only party that knows which Provider it is
        about to invoke. The assignment it records is a side table keyed by
        Execution id, written inside start's existing transaction, so it
        appears and disappears with the Execution it describes. Absent records
        no assignment and changes no Provider's active_assignments; a value
        outside the closed set of three is refused with 400 and records
        nothing.
      properties: {request_id: {type: string}, expected_execution_version: {type: integer}, control_revision: {type: integer}, provider: {type: string, enum: [codex, claude, opencode]}}
