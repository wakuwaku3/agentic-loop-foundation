      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
        option_id: {type: string, maxLength: 64}
    AnswerHumanInputResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version, answered_option_id, answered_at, answered_by]
      properties:
        requirement_id: {type: string}
        status: {type: string, description: 'the SAME Requirement, resumed; no Requirement is created by an answer'}
        version: {type: integer}
        answered_option_id: {type: string, maxLength: 64}
        answered_at: {type: string, format: date-time}
        answered_by: {$ref: '#/components/schemas/RequestedBy'}
    StartRequirementFramingRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_requirement_version]
      description: |
        There is deliberately no control_revision, no repository_id and no
        timestamp field. The control revision is derived from the effective
        control inside the command's own transaction, the repository comes
        from the Requirement's own link, and the instant is that
        transaction's authority time: none of the three can be supplied by a
        caller.
      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
    StartRequirementFramingResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version]
      properties:
        requirement_id: {type: string, description: 'the SAME Requirement; framing creates nothing'}
        status: {type: string, description: 'framing, which is the status from which a question can be asked'}
        version: {type: integer}
    CompleteRequirementFramingRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_requirement_version]
      description: |
        There is deliberately no control_revision, no repository_id and no
        timestamp field. The control revision is derived from the effective
        control inside the command's own transaction, the repository comes
        from the Requirement's own link, and the instant is that
        transaction's authority time: none of the three can be supplied by a
        caller.
      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
    CompleteRequirementFramingResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version]
      properties:
        requirement_id: {type: string, description: 'the SAME Requirement; completing framing creates nothing'}
        status: {type: string, description: 'ready, which is the only status the scheduler treats as schedulable'}
        version: {type: integer}
    PauseRequirementRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_requirement_version]
      description: |
        The whole request is a request_id and the version the caller believes
        the Requirement is at. There is deliberately no control_revision, no
        repository_id and no timestamp field. The control revision is derived
        from the effective control inside the command's own transaction, the
        repository comes from the Requirement's own link, and the instant is
        that transaction's authority time: none of the three can be supplied by
        a caller.
      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
    PauseRequirementResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version, resumes_to]
      properties:
        requirement_id: {type: string, description: 'the SAME Requirement; pausing creates nothing'}
        status: {type: string, description: 'paused'}
        version: {type: integer}
        resumes_to: {type: string, description: 'the status a resume WILL restore this Requirement to -- the status it was in immediately before the pause, one of ready, active, waiting or recovering. It is read back from the stored record rather than from the request, so it cannot disagree with what a later resume actually does.'}
    ResumeRequirementRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_requirement_version]
      description: |
        The whole request is a request_id and the version the caller believes
        the Requirement is at. There is deliberately no control_revision, no
        repository_id and no timestamp field. The control revision is derived
        from the effective control inside the command's own transaction, the
        repository comes from the Requirement's own link, and the instant is
        that transaction's authority time: none of the three can be supplied by
        a caller.
      properties:
        request_id: {type: string}
        expected_requirement_version: {type: integer}
    ResumeRequirementResponse:
      type: object
      additionalProperties: false
      required: [requirement_id, status, version]
      properties:
        requirement_id: {type: string, description: 'the SAME Requirement; resuming creates nothing'}
        status: {type: string, description: 'the status the Requirement was in when it was paused, restored exactly'}
        version: {type: integer}
    CancelRequirementRequest:
      type: object
      additionalProperties: false
      required: [request_id, expected_requirement_version]
      description: |
        The whole request is a request_id and the version the caller believes
        the Requirement is at. There is deliberately no control_revision, no
        repository_id and no timestamp field. The control revision is derived
        from the effective control inside the command's own transaction, the
