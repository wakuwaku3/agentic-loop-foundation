openapi: 3.1.0
info:
  title: Agentic Loop Control Plane
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /error:
    get:
      operationId: errorExample
      responses:
        '400':
          description: Contract-shaped error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, schema_version]
      properties:
        status: {type: string, enum: [ok]}
        schema_version: {type: string, const: v1}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message, schema_version]
      properties:
        error: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        schema_version: {type: string, const: v1}
        correlation_id: {type: string}
